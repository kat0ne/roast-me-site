<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trend Tracker</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="container">
    <h1>Trend Tracker</h1>

    <div class="form">
      <input id="title" placeholder="Titre de la tendance" />
      <input id="category" placeholder="Catégorie (TikTok, SaaS...)" />
      <input id="score" type="number" placeholder="Score viral (1-10)" />
      <button id="addBtn">Ajouter</button>
    </div>

    <input id="search" placeholder="Rechercher..." />

    <div id="list"></div>
  </div>

  <script type="module" src="./main.ts"></script>

</body>
</html>
